<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio — Menú Digital</title>
<link rel="icon" type="image/x-icon" href="../img/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../img/favicon/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="../img/favicon/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">

<style>
  /* ============================================================
     TOKENS — identidad negro / blanco / dorado (heredada del Backoffice)
     ============================================================ */
  :root{
    --bg:#050506; --bg-2:#0B0B0D;
    --surface:#141416; --surface-2:#1D1D20; --surface-hover:#242427;
    --border:rgba(245,243,236,.09); --border-strong:rgba(245,243,236,.18);
    --text:#F3F1EC; --muted:#9C978F; --muted-2:#716C65;
    --gold:#C9A227; --gold-light:#E7C767;
    --gold-soft:rgba(201,162,39,.12); --gold-glow:rgba(201,162,39,.32);
    --danger:#D97373; --danger-soft:rgba(217,115,115,.12);
    --radius-lg:18px; --radius-md:13px; --radius-sm:10px;
    --gap-section:30px;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; padding:0; color:var(--text); background:var(--bg);
    font-family:'Plus Jakarta Sans','Segoe UI',sans-serif;
    min-height:100vh; -webkit-tap-highlight-color:transparent;
    position:relative; isolation:isolate;
  }
  /* Textura de marca muy atenuada + degradado negro→dorado sutil, en vez de una foto dominante */
  body::before{
    content:""; position:fixed; inset:0; z-index:-2;
    background-image:url('https://gkfafkntrvskcplvystz.supabase.co/storage/v1/object/public/menu-imagenes/fondo/fondo.jpeg');
    background-size:cover; background-position:center; background-attachment:fixed;
    filter:grayscale(1) brightness(.35) contrast(1.05);
    opacity:.06;
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse 900px 520px at 8% -10%, rgba(201,162,39,.14), transparent 60%),
      radial-gradient(ellipse 760px 520px at 108% 0%, rgba(245,243,236,.05), transparent 55%),
      linear-gradient(180deg,#0C0C0E 0%, #08080A 45%, #050506 100%);
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--gold-soft); color:var(--gold-light);}

  .home{width:100%; max-width:560px; margin:0 auto; padding:18px 16px 90px;}
  @media(min-width:760px){.home{max-width:740px; padding-top:26px;}}
  @media(min-width:1080px){.home{max-width:1080px;}}

  /* ── Movimiento: un único gesto de entrada, respetando reduced-motion ── */
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .app-bar, .stats-row, .block{animation:fadeUp .5s var(--ease) both;}
  .app-bar{animation-delay:0s;}
  .stats-row{animation-delay:.05s;}
  .block:nth-of-type(1){animation-delay:.1s;}
  .block:nth-of-type(2){animation-delay:.16s;}
  .block:nth-of-type(3){animation-delay:.22s;}
  .block:nth-of-type(4){animation-delay:.28s;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
  }

  /* ── App bar ────────────────────────────────────────────── */
  .app-bar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 16px; margin:-18px -16px 20px;
    background:rgba(8,8,9,.86); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
  }
  @media(min-width:760px){.app-bar{margin:-26px 0 24px; border-radius:16px; border:1px solid var(--border); padding:16px 20px;}}
  .app-bar .user-side{display:flex; align-items:center; gap:12px; min-width:0;}
  .app-bar-avatar{
    width:44px; height:44px; border-radius:50%; flex:0 0 auto;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    display:flex; align-items:center; justify-content:center;
    color:#171208; font-weight:800; font-size:16px; letter-spacing:.02em;
    border:2px solid rgba(245,243,236,.14);
  }
  .app-bar .greet{min-width:0;}
  .app-bar .greet-label{font-size:10.5px; color:var(--gold); text-transform:uppercase; letter-spacing:.12em; font-weight:700;}
  .app-bar .greet-name{
    font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .app-bar-actions{display:flex; gap:8px; align-items:center; flex:0 0 auto;}
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    transition:border-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
  }
  .icon-btn:hover{color:var(--gold); border-color:var(--gold); transform:translateY(-1px);}
  .icon-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .icon-btn:active{transform:translateY(0);}

  /* ── Resumen rápido ─────────────────────────────────────── */
  .stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:var(--gap-section);}
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:13px 14px; min-width:0;
  }
  .stat-card .stat-value{font-family:'Fraunces',serif; font-size:24px; font-weight:600; line-height:1.1;}
  .stat-card.gold .stat-value{color:var(--gold);}
  .stat-card .stat-label{font-size:11px; color:var(--muted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  @media(max-width:360px){.stat-card{padding:10px 11px;} .stat-card .stat-value{font-size:20px;}}

  /* ── Secciones ──────────────────────────────────────────── */
  section.block{margin-bottom:var(--gap-section);}
  .section-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-top:18px; margin-bottom:15px; border-top:1px solid var(--border);
  }
  .home > .block:first-of-type .section-head{border-top:none; padding-top:0;}
  .section-head .heading{display:flex; align-items:center; gap:10px; min-width:0;}
  .section-icon{
    width:32px; height:32px; border-radius:9px; flex:0 0 auto;
    background:var(--gold-soft); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .section-title{font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0;}
  .section-action{
    display:inline-flex; align-items:center; gap:6px; flex:0 0 auto;
    font-size:12.5px; font-weight:600; color:var(--text);
    background:var(--surface); border:1px solid var(--border); padding:8px 13px; border-radius:99px;
    cursor:pointer; text-decoration:none; white-space:nowrap;
    transition:border-color .18s var(--ease), color .18s var(--ease);
  }
  .section-action:hover{border-color:var(--gold); color:var(--gold-light);}
  .section-action i{font-size:10px;}

  /* ── Rail horizontal con scroll táctil ─────────────────── */
  .rail{display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 8px;
    scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent;}
  .rail::-webkit-scrollbar{height:5px;}
  .rail::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:99px;}
  .rail > *{scroll-snap-align:start; flex:0 0 auto;}

  /* ── Avatar de negocio (Menus) ─────────────────────────── */
  .biz-avatar-wrap{display:flex; flex-direction:column; align-items:center; gap:8px; width:84px;}
  .biz-avatar{
    width:68px; height:68px; border-radius:50%; cursor:pointer; position:relative;
    background:var(--surface-2); border:2px solid var(--border); padding:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-weight:700; font-size:20px; letter-spacing:.02em;
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
    overflow:hidden;
  }
  .biz-avatar img{width:100%; height:100%; object-fit:cover;}
  .biz-avatar:hover, .biz-avatar:focus-visible{border-color:var(--gold); box-shadow:0 0 0 4px var(--gold-soft); transform:translateY(-2px);}
  .biz-avatar:focus-visible{outline:none;}
  .biz-avatar-name{font-size:12px; color:var(--muted); text-align:center; max-width:84px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ── Populares (destacados) ─────────────────────────────── */
  .pop-rail{display:grid; grid-auto-columns:78%; grid-auto-flow:column; gap:14px; overflow-x:auto;
    scroll-snap-type:x mandatory; padding:2px 2px 8px; scrollbar-width:thin;
    scrollbar-color:var(--gold-glow) transparent;}
  .pop-rail::-webkit-scrollbar{height:5px;}
  .pop-rail::-webkit-scrollbar-thumb{background:var(--gold-glow); border-radius:99px;}
  .pop-card{
    scroll-snap-align:center; border-radius:var(--radius-lg); overflow:hidden; cursor:pointer;
    background:var(--surface); border:1px solid var(--border);
    box-shadow:0 10px 26px rgba(0,0,0,.35);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
  }
  .pop-card:hover{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold-glow), 0 14px 30px rgba(0,0,0,.4); transform:translateY(-3px);}
  .pop-card .pop-img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--surface-2);}
  .pop-card .pop-body{padding:13px 15px;}
  .pop-card .pop-tag{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; letter-spacing:.04em;
    color:var(--gold); font-weight:700; margin-bottom:6px;
  }
  .pop-card .pop-tag i{font-size:9px;}
  .pop-card .pop-name{font-size:15px; font-weight:700; margin:0 0 3px;}
  .pop-card .pop-biz{font-size:12px; color:var(--muted);}
  .pop-card.noimg .pop-img{display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--gold); background:var(--surface-2);}

  /* ── Productos (grid de cards cuadradas) ───────────────── */
  .prod-rail{display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 8px;
    scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent;}
  .prod-rail::-webkit-scrollbar{height:5px;}
  .prod-rail::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:99px;}
  .prod-card{width:100px; scroll-snap-align:start; cursor:pointer; transition:transform .18s var(--ease);}
  .prod-card:hover{transform:translateY(-2px);}
  .prod-card .thumb{
    width:100px; height:100px; border-radius:var(--radius-md); overflow:hidden;
    background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--muted-2); font-size:22px;
    transition:border-color .18s var(--ease);
  }
  .prod-card .thumb img{width:100%; height:100%; object-fit:cover;}
  .prod-card:hover .thumb{border-color:var(--gold);}
  .prod-card .p-name{
    font-size:12px; margin-top:8px; color:var(--text); text-align:center; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* ── Imagenes (galería) ─────────────────────────────────── */
  .img-card{width:134px; scroll-snap-align:start; cursor:pointer; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;
    transition:border-color .18s var(--ease), transform .18s var(--ease);}
  .img-card:hover{border-color:var(--gold); transform:translateY(-2px);}
  .img-card .thumb{width:134px; height:134px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--muted-2);}
  .img-card .thumb img{width:100%; height:100%; object-fit:cover;}
  .img-card .cap{padding:9px 11px;}
  .img-card .cap-title{font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .img-card .cap-sub{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}

  /* ── Escritorio: los rails pasan a grid para aprovechar el ancho ── */
  @media(min-width:1080px){
    .prod-rail, #imgRail{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); overflow:visible; gap:16px;}
    .prod-card, .prod-card .thumb{width:100%;}
    .prod-card .thumb{aspect-ratio:1/1; height:auto;}
    .img-card, .img-card .thumb{width:100%; max-width:220px;}
    .img-card .thumb{aspect-ratio:1/1; height:auto;}
    .pop-rail{grid-auto-columns:340px;}
    .biz-avatar{width:76px; height:76px; font-size:24px;}
    .biz-avatar-wrap{width:96px;}
    .biz-avatar-name{max-width:96px;}
  }

  /* ── Estados: vacío / error ─────────────────────────────── */
  .state-block{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius-md);
    padding:16px; color:var(--muted); font-size:13px; line-height:1.5;
  }
  .state-block i{font-size:16px; color:var(--gold); margin-top:1px; flex:0 0 auto;}
  .state-block.is-error{border-color:rgba(217,115,115,.35); background:var(--danger-soft);}
  .state-block.is-error i{color:var(--danger);}
  .state-block .state-text b{color:var(--text); display:block; margin-bottom:2px; font-weight:700;}
  .state-block .retry-btn{
    margin-top:8px; font-size:12.5px; font-weight:700; color:var(--gold); background:none;
    border:none; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:2px;
  }
  .state-block .retry-btn:hover{color:var(--gold-light);}

  /* ── Skeletons (carga) ──────────────────────────────────── */
  .skeleton{
    background:linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 45%, var(--surface) 60%);
    background-size:250% 100%; animation:skWave 1.4s ease-in-out infinite;
  }
  @keyframes skWave{0%{background-position:120% 0;} 100%{background-position:-20% 0;}}
  @media (prefers-reduced-motion: reduce){.skeleton{animation:none; opacity:.55;}}
  .sk-stat{height:58px; border-radius:var(--radius-md);}
  .sk-avatar-wrap{display:flex; flex-direction:column; align-items:center; gap:8px; width:84px;}
  .sk-avatar{width:68px; height:68px; border-radius:50%;}
  .sk-avatar-label{width:56px; height:10px; border-radius:99px;}
  .sk-pop{width:78%; flex:0 0 auto; border-radius:var(--radius-lg); overflow:hidden;}
  .sk-pop .sk-pop-img{aspect-ratio:16/9;}
  .sk-pop .sk-pop-body{padding:13px 15px; display:flex; flex-direction:column; gap:8px;}
  .sk-pop .sk-line{height:10px; border-radius:99px; width:60%;}
  .sk-prod{width:100px; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .sk-prod .sk-thumb{width:100px; height:100px; border-radius:var(--radius-md);}
  .sk-prod .sk-line{width:70px; height:9px; border-radius:99px;}

  .empty-block{color:var(--muted); font-size:13px; padding:8px 2px;}
</style>

<body>
<div class="home">

  <!-- App bar -->

      <div class="app-bar-avatar" id="barAvatar"></div>

  <!-- Menus → Negocios -->

</div>
